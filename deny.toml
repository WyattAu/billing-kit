# WyattAu dependency governance — cargo-deny configuration.
# Copy to the repo root. Policies: see engineering-standards README §7.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # RUSTSEC-2026-0543: chrono unmaintained (informational, all versions).
  # Unpatchable by pin bump; migration to jiff is tracked work, not a
  # dependency edit. Period arithmetic (billing cycles) uses chrono's
  # Months/MonthsOffset which jiff does not yet cover 1:1.
  "RUSTSEC-2026-0543",
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
